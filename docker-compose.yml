# Starry 默认部署：一条命令起（前端 + 后端 + PostgreSQL）
#
#   cp .env.example .env      # 至少设置 POSTGRES_PASSWORD
#   docker compose up -d --build
#
# 打开 http://localhost:8787 ，首次进 /setup 设管理员密码。
#
# 镜像默认从本仓库源码构建（build: .）。想用预构建镜像：注释掉 build 段，
# 保留 image（ghcr.io/szjakall/naiwa:<tag>）即可。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-starry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starry} -d ${POSTGRES_DB:-starry}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  starry:
    build:
      context: .
      args:
        VERSION: ${STARRY_TAG:-dev}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: ${STARRY_IMAGE:-starry:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STARRY_PG_DSN: postgres://${POSTGRES_USER:-starry}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-starry}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STARRY_LLM_PROVIDER: ${STARRY_LLM_PROVIDER:-}
      STARRY_LLM_MODEL: ${STARRY_LLM_MODEL:-}
      STARRY_LLM_BASE_URL: ${STARRY_LLM_BASE_URL:-}
      STARRY_LLM_PROXY: ${STARRY_LLM_PROXY:-}
    ports:
      - "${STARRY_PORT:-8787}:8787"        # 控制台
      - "${STARRY_PROXY_PORT:-8788}:8788"  # MITM 抓包代理
    volumes:
      # 数据目录（jwt.key、流量录制、抓包、报告、物化的 skills）落宿主机，容器重建不丢
      - ./data:/app/data
      # 想改内置 skill 而不重建镜像：解开下面这行，容器读宿主机这份
      # - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata: